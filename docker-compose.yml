services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: keycloak_jwt_example
      POSTGRES_USER: keycloak_jwt
      POSTGRES_PASSWORD: keycloak_jwt
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_jwt -d keycloak_jwt_example"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - ./e2e/keycloak:/opt/keycloak/data/import
